    <script>
      // Suppress and intercept benign Vite HMR WebSocket errors in AI Studio iframe environment
      (function() {
        if (typeof window !== 'undefined') {
          var RealWebSocket = window.WebSocket;
          if (RealWebSocket) {
            window.WebSocket = function(url, protocols) {
              if (
                protocols === 'vite-hmr' ||
                (typeof protocols === 'string' && protocols.indexOf('vite') !== -1) ||
                (Array.isArray(protocols) && protocols.indexOf('vite-hmr') !== -1) ||
                (typeof url === 'string' && (url.indexOf('vite') !== -1 || url.indexOf('hmr') !== -1))
              ) {
                return {
                  readyState: 3,
                  binaryType: 'blob',
                  url: String(url),
                  protocol: protocols,
                  send: function() {},
                  close: function() {},
                  addEventListener: function() {},
                  removeEventListener: function() {},
                  dispatchEvent: function() { return false; },
                  onopen: null,
                  onclose: null,
                  onerror: null,
                  onmessage: null,
                };
              }
              return new RealWebSocket(url, protocols);
            };
            window.WebSocket.prototype = RealWebSocket.prototype;
          }

          var suppressError = function (e) {
            var msg = e && (e.message || (e.error && e.error.message) || String(e) || '');
            if (
              msg.indexOf('WebSocket') !== -1 ||
              msg.indexOf('vite') !== -1 ||
              msg.indexOf('ws') !== -1
            ) {
              if (e.stopImmediatePropagation) e.stopImmediatePropagation();
              if (e.preventDefault) e.preventDefault();
              return true;
            }
          };

          window.addEventListener('error', suppressError, true);
          window.addEventListener('unhandledrejection', function (e) {
            var reason = e.reason && (e.reason.message || String(e.reason));
            if (reason && (reason.indexOf('WebSocket') !== -1 || reason.indexOf('vite') !== -1)) {
              if (e.stopImmediatePropagation) e.stopImmediatePropagation();
              if (e.preventDefault) e.preventDefault();
              return true;
            }
          }, true);
        }
      })();
    </script>
