<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgMaskGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="50%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="accentGradM" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="shadowM" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Full-bleed background with NO corner radius (maskable standard) -->
  <rect width="512" height="512" fill="url(#bgMaskGrad)" />

  <!-- Inner Content scaled down inside the 80% safe zone circle (center 256, 256, radius 200) -->
  <g transform="translate(64, 64) scale(0.75)">
    <!-- Circuit lines -->
    <path d="M 64 160 H 160 V 220" stroke="#3b82f6" stroke-width="4" stroke-opacity="0.3" stroke-linecap="round" fill="none" />
    <circle cx="64" cy="160" r="8" fill="#60a5fa" opacity="0.5" />
    <circle cx="160" cy="220" r="6" fill="#60a5fa" opacity="0.5" />

    <path d="M 448 352 H 352 V 292" stroke="#3b82f6" stroke-width="4" stroke-opacity="0.3" stroke-linecap="round" fill="none" />
    <circle cx="448" cy="352" r="8" fill="#60a5fa" opacity="0.5" />
    <circle cx="352" cy="292" r="6" fill="#60a5fa" opacity="0.5" />

    <circle cx="256" cy="256" r="168" stroke="#60a5fa" stroke-width="6" fill="none" opacity="0.4" />

    <g filter="url(#shadowM)">
      <path d="M 230 148 H 280 V 290 C 280 326 256 348 214 348 C 182 348 160 332 152 308 L 194 294 C 198 304 206 312 216 312 C 230 312 238 304 238 288 Z" fill="#ffffff" />
      <path d="M 295 140 L 235 250 H 285 L 260 372 L 355 235 H 300 Z" fill="url(#accentGradM)" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" />
    </g>

    <circle cx="216" cy="400" r="6" fill="#fbbf24" />
    <circle cx="256" cy="400" r="6" fill="#ffffff" opacity="0.8" />
    <circle cx="296" cy="400" r="6" fill="#60a5fa" />
  </g>
</svg>
